version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mobile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  web:
    build: .
    command: gunicorn mobile_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  celery:
    build: .
    command: celery -A mobile_backend worker -l info
    depends_on:
      - redis
      - db
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - web
volumes:
  pgdata:
